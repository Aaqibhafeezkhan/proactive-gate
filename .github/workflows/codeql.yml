name: codeql
# Static analysis (CodeQL) of the TypeScript and Python source. Results appear under Security > Code scanning and
# feed the OpenSSF Scorecard "SAST" check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:
permissions: {}
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # v3 (codeql-bundle-v2.26.4)
        with:
          languages: javascript-typescript,python
          build-mode: none
      - uses: github/codeql-action/analyze@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # v3 (codeql-bundle-v2.26.4)
        with:
          category: "/language:javascript-typescript-python"
