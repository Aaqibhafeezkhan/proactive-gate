name: "I use proactive-gate"
description: "Tell others how you use proactive-gate."
title: "Adopter: "
labels: ["adopter"]
body:
  - type: input
    id: name
    attributes:
      label: Name
      description: Your name, team, or organization.
      placeholder: Team or organization name
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      description: A public link for your team or project.
      placeholder: https://example.com
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What does proactive-gate decide for you?
      description: One sentence describing the decision the gate makes in your use case.
      placeholder: It decides whether our assistant may send a reminder based on consent and quiet hours.
      render: text
    validations:
      required: true
  - type: input
    id: channel
    attributes:
      label: Optional channel
      description: Optional public channel or contact link.
      placeholder: https://example.com/community
    validations:
      required: false
